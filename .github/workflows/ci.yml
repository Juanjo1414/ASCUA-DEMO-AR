# CI de ASCUA-DEMO-AR (ARFOODS) — reemplaza el ci.yml anterior (tarea A-002).
# Requiere A-001 (eslint.config.mjs en apps/web); sin eso, el paso de lint falla.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'dev/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r lint
      - name: Tipos
        run: |
          pnpm --filter web exec tsc --noEmit
          pnpm --filter worker exec tsc --noEmit
      - name: Pruebas
        run: pnpm -r test
      - name: Build
        env:
          # Valores ficticios: el build no debe necesitar un Supabase real.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          REVALIDATE_SECRET: ci-placeholder
          NEXT_PUBLIC_DEMO_MODE: 'true'
        run: pnpm -r build

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2 # TODO(X-008): fijar por SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias de producción (bloquea en high/critical)
        run: pnpm audit --prod --audit-level high
