# Verifica que la imagen Docker del worker construya (incluye usd_from_gltf).
# Solo corre si cambia el worker o el paquete db, porque es un build pesado.
name: Worker image

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
  push:
    branches: ['dev/**']
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'

permissions:
  contents: read

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build de la imagen (sin publicar)
        run: docker build -f apps/worker/Dockerfile -t arfoods-worker:ci .
      - name: La imagen no contiene archivos .env
        run: |
          if docker run --rm --entrypoint sh arfoods-worker:ci -c 'find / -name ".env*" -not -name ".env.example" 2>/dev/null | grep -v proc' | grep .; then
            echo "::error::Se encontraron archivos .env dentro de la imagen"; exit 1; fi
